name: Resources

on:
  pull_request:
    paths:
      - "resources/**"
      - "scripts/**"
      - "package.json"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run links:check
